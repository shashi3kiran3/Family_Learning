<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family_Learning</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-topbar" aria-label="Learner and earnings">
      <div class="brand-lockup">
        <p class="eyebrow">Family math rewards</p>
        <h1 id="game-title">Family_Learning</h1>
      </div>
      <div class="profile-tabs" role="tablist" aria-label="Choose learner">
        <button class="profile-tab is-active" type="button" data-user="harshith" role="tab" aria-selected="true">Harshith</button>
        <button class="profile-tab is-disabled" type="button" data-user="charith" role="tab" aria-selected="false" disabled>Charith</button>
      </div>
      <div class="overall-earning" aria-live="polite">
        <span>Overall earning</span>
        <strong id="dollar-total">$0.00</strong>
      </div>
    </header>

    <main class="game-shell">
      <section class="play-area" aria-labelledby="game-title">
        <div class="title-row">
          <div>
            <p class="section-label">Harshith's challenge</p>
            <h2>Math Quest</h2>
          </div>
          <div class="score-card" aria-live="polite">
            <span class="score-label">Session</span>
            <strong id="session-pennies">0p</strong>
          </div>
        </div>

        <div class="level-row" role="group" aria-label="Choose difficulty">
          <button class="level-button is-active" type="button" data-difficulty="easy">Easy</button>
          <button class="level-button" type="button" data-difficulty="medium">Medium</button>
          <button class="level-button" type="button" data-difficulty="hard">Hard</button>
        </div>

        <div class="question-card">
          <div class="question-topline">
            <span id="round-label">Question 1</span>
            <span id="streak-label">Streak: 0</span>
          </div>
          <div class="reward-preview" id="reward-preview">Next correct answer: +1 penny</div>
          <p id="question-text" class="question-text"></p>
          <form id="answer-form" class="answer-form" autocomplete="off">
            <label class="sr-only" for="answer-input">Answer</label>
            <input
              id="answer-input"
              inputmode="numeric"
              pattern="[0-9-]*"
              type="text"
              placeholder="Type answer"
              aria-describedby="feedback"
            />
            <button type="submit">Check</button>
          </form>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </div>

        <div class="actions">
          <button id="hint-button" class="secondary-button" type="button">Hint</button>
          <button id="next-button" class="secondary-button" type="button">New question</button>
        </div>
      </section>

      <aside class="reward-area" aria-label="Reward jar">
        <div class="money-board">
          <div>
            <span>Redeemable</span>
            <strong id="available-dollars">$0.00</strong>
          </div>
          <div>
            <span>Pennies saved</span>
            <strong id="available-pennies">0</strong>
          </div>
        </div>
        <button id="redeem-button" class="redeem-button" type="button">Redeem reward</button>
        <div class="jar-scene">
          <svg class="coin-spark" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="46" fill="#f6be4f" />
            <circle cx="60" cy="60" r="34" fill="#ffd86f" />
            <path d="M48 74c8 6 19 6 27 0" fill="none" stroke="#986118" stroke-width="6" stroke-linecap="round" />
            <circle cx="47" cy="52" r="5" fill="#8d5a16" />
            <circle cx="73" cy="52" r="5" fill="#8d5a16" />
          </svg>
          <div class="jar" id="coin-jar" aria-hidden="true"></div>
          <div class="jar-base"></div>
        </div>
        <p class="goal-copy">250 pennies = $1.00 reward.</p>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <section class="daily-report" aria-labelledby="daily-report-title">
          <h2 id="daily-report-title">Today</h2>
          <div class="report-grid">
            <span>Correct</span>
            <strong id="today-correct">0</strong>
            <span>Mistakes</span>
            <strong id="today-mistakes">0</strong>
            <span>Earned</span>
            <strong id="today-earned">0p</strong>
            <span>Best streak</span>
            <strong id="best-streak">0</strong>
          </div>
        </section>
      </aside>
    </main>

    <template id="coin-template">
      <span class="coin" aria-hidden="true"></span>
    </template>

    <script src="./script.js"></script>
  </body>
</html>
